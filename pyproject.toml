[project]
name = "trails"
version = "0.1.0"
description = "Analysis of hiking trail data using Jupyter notebooks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "geopandas>=1.1.4",
    # Imported directly in thirteen modules, the whole of routing/ among them,
    # and present until now only because geopandas happens to pull it in.
    "shapely>=2.1.2",
    "matplotlib>=3.11.1",
    "folium>=0.20.0",
    # Same: visualization/maps.py builds on branca's MacroElement, which
    # arrived only as folium's own dependency.
    "branca>=0.8.2",
    "feedparser>=6.0.14",
    "pyarrow>=25.0.1",
    "lxml>=6.1.1",
    "tqdm>=4.70.0",
    "requests>=2.34.2",
]

[dependency-groups]
jupyter = [
    "jupyterlab>=4.6.3",
    "ipykernel>=7.3.0",
    "notebook>=7.6.2",
    "ipyleaflet>=0.20.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "nbqa>=1.9.1",
    "pre-commit>=4.6.2",
    "nbstripout>=0.9.1",
    "pandas-stubs>=3.0.5.260730",
    "types-geopandas>=1.1.4.20260807", # inoffical release
    "types-requests>=2.33.0.20260712",
]

[tool.uv]
# Configure default dependency groups for uv sync
# This ensures both dev and jupyter dependencies are installed by default,
# which is necessary for PyCharm compatibility. PyCharm's uv integration
# only syncs default groups, and without this configuration, jupyter
# dependencies would be removed during PyCharm's automatic sync.
default-groups = ["dev", "jupyter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs/src/trails", "pipeline/src/graphhopper_pipeline"]

[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
mypy_path = "libs/src:pipeline/src"

[tool.pytest.ini_options]
testpaths = ["libs/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests that require network access (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow running",
]
