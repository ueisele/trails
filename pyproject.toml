[project]
name = "trails"
version = "0.1.0"
description = "Analysis of hiking trail data using Jupyter notebooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "geopandas>=1.0.0",
    "matplotlib>=3.8.0",
    "folium>=0.17.0",
    "feedparser>=6.0.12",
    "pyarrow>=21.0.0",
    "lxml>=6.0.2",
    "tqdm>=4.67.1",
    "requests>=2.32.5",
]

[dependency-groups]
jupyter = [
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
    "notebook>=7.2.0",
    "ipyleaflet>=0.20.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "nbqa>=1.9.1",
    "pre-commit>=4.3.0",
    "nbstripout>=0.8.1",
    "pandas-stubs>=2.3.2.250827",
    "types-geopandas>=1.0.0", # inoffical release
    "types-requests>=2.32.4.20250913",
]

[tool.uv]
# Configure default dependency groups for uv sync
# This ensures both dev and jupyter dependencies are installed by default,
# which is necessary for PyCharm compatibility. PyCharm's uv integration
# only syncs default groups, and without this configuration, jupyter
# dependencies would be removed during PyCharm's automatic sync.
default-groups = ["dev", "jupyter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs/src/trails", "pipeline/src/graphhopper_pipeline"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
# 3.12 rather than the 3.11 the project supports at runtime: numpy 2.5 dropped
# 3.11 and writes its stubs with PEP 695 `type` statements, which mypy refuses
# to parse when told to target 3.11 — fatally, before any per-module override
# can apply. The lock resolves numpy 2.4.6 on 3.11 and 2.5.2 from 3.12 on, so a
# 3.11 interpreter still gets stubs it can read; only this setting had to move.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
mypy_path = "libs/src:pipeline/src"

[tool.pytest.ini_options]
testpaths = ["libs/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests that require network access (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow running",
]
