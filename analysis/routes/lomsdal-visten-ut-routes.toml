# UT.no hiking routes for Lomsdal-Visten national park.
#
# Researched by hand on 2026-08-10, because Nasjonal Turbase — the API behind
# ut.no — needs a DNT key that is no longer handed out. Every route below was
# checked to return a GPX with a non-empty track and one segment.
#
# The GPX itself is not listed per route: it is always
# https://ut.no/api/gpx/trip/<id>, which trails.io.sources.ut derives from the
# id. The page URLs are recorded verbatim, since their slugs are not derivable.
#
# Ski and cycling tours are deliberately excluded.
#
# category = "core"    a route inside the park or one of its main routes
# category = "access"  a track that ends short of the core area, or only leads in
#
# ut_summary is what UT.no itself states, taken from the trip data behind each
# route page on 2026-08-12: distance, walking time, and ascent. It is not the
# measured length of the GPX track, and the two often differ by a kilometre or
# more — the map shows both, side by side.
#
# "return" means UT's distance already covers the way back, and "round trip"
# that the route closes on itself. Both come from UT's own direction field
# (ABA / AA), not from an estimate.

name = "Lomsdal-Visten"
compiled = "2026-08-10"
source = "https://ut.no"
guide = "https://lomsdalvisten.no"

