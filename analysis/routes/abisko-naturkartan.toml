# Naturkartan's pages for the state trails over the Abisko box.
#
# Researched by hand on 2026-09-12 through naturkartan.se's own search, because
# the page slugs are not derivable from the trail number and a short URL by
# site id answers 404. Every page below answered 200 that day and carries a
# site id of its own (12842 for BD 16, 12850 for BD 21, and so on).
#
# The id is the register's number, `STATLED_ID` in Naturvårdsverket's Leder
# file, which is what the county's brochures, the signs and Naturkartan all
# use. Nothing but the link is taken from Naturkartan: its terms allow private
# use only, and the line itself is the county's state trail, which the
# register draws (analysis/docs/abisko-decisions.md §5, §9.22).
#
# Of the fifteen state trails the register draws over the box, two have no
# page on Naturkartan: BD 23 (Riksgränsen - Unna Allakas) and BD 29 (Alesjaure
# - Alesätno - Årosjokk). Searched for by number and by every place in their
# names.

name = "Abisko"
compiled = "2026-09-12"
source = "https://www.naturkartan.se"
publisher = "Länsstyrelsen Norrbotten"

