name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So the pipeline can be run without inventing a commit to run it with.
  workflow_dispatch:

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # **No Python is set up here, on purpose.** `.python-version` and
      # `requires-python` are what decide, and uv fetches an interpreter that
      # satisfies them. Naming a version here would be a fifth statement of one
      # decision — and the one that stood here, `setup-python` at 3.11, was
      # three releases behind the floor and had no effect either way: uv
      # downloaded its own 3.14 and used that.
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # **The same command the developer runs and the hooks enforce**:
      # format-check, lint, type and test, over every tree at once. Restating a
      # subset of it here is how this workflow came to run `nbqa ruff` on the
      # notebooks where `make lint` runs ruff's own notebook support — two tools
      # answering one question, only one of them before a commit, and the two
      # answers disagree: nbqa joins the cells into one file, so an import in
      # cell 20 is "not at the top of the file" and a bare `frame` on a cell's
      # last line, which is how a notebook shows a value, is a "useless
      # expression". That step failed on every run this repository has had.
      - name: Run every check
        run: make check

  all-tests:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [check]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "❌ Checks failed"
            exit 1
          fi
          echo "✅ All checks passed"
